<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face2Face</title>
    <link rel="stylesheet" href="estilo.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div id="loaderPagina" class="section_loader">
        <div class="loader">
            <div class="loader_1"></div>
            <div class="loader_2"></div>
        </div>
    </div>
    <div class="principio">
        <h2>
            <span class="text-left">Face</span><span class="text-center">2</span><span class="text-right">Face</span><span class="version">(Beta)</span>
        </h2>
        <h2 class="pagi">5/5</h2>
    </div>

    <div class="barra">
        <div class="progreso" id="barraProg"></div>
        <span class="tex-progreso" id="pag">1/5</span>
    </div>

    <div class="content-prin">
        <h2>¿Qué prefieres?</h2>
        <input type="radio" name="prefiere" id="mexico_c" class="boton" value="mexico">
        <label for="mexico_c" class="tarjeta">
            <img src="img-finalVersion/camMex.JPG" alt="seleccion Mex" class="img_int">
            <span class="nombre">México Campeón</span>
        </label>
        <h2>O</h2>
        <input type="radio" name="prefiere" id="eng_c" class="boton" value="inglaterra">
        <label for="eng_c" class="tarjeta">
            <img src="img-finalVersion/camEng.JPG" alt="seleccion eng" class="img_int">
            <span class="nombre">Inglaterra Campeón</span>
        </label>

        <button id="botonGuardar" class="guardado">Guardar</button>
    </div>

    <div class="sig-pag">
        <a href="preguntas4.html">
            <button class="bot-pag">
                <span class="shadow"></span>
                <span class="edge"></span>
                <span class="front text">Pág. Anterior</span>
            </button>
        </a>
        <a href="resultado.html">
            <button class="bot-pag">
                <span class="shadow"></span>
                <span class="edge"></span>
                <span class="front text">Finalizar</span>
            </button>
        </a>
    </div>
    <script src="script.js"></script>
</body>
</html>
